# Herdr configuration managed by ~/dotfiles/herdr.
# This intentionally mirrors the muscle memory from tmux/.config/tmux/tmux.conf
# where Herdr has equivalent concepts (workspaces ~= tmux sessions, tabs ~= windows,
# panes ~= panes). Reload with: herdr server reload-config

onboarding = false

[theme]
# Follow the terminal palette, like the tmux status theme does.
name = "terminal"

[theme.custom]
accent = "blue"
blue = "blue"

[terminal]
# Match tmux's `-c "#{pane_current_path}"` bindings: new panes/tabs/workspaces
# follow the currently focused pane/workspace directory.
new_cwd = "follow"
shell_mode = "auto"

[update]
channel = "stable"
version_check = true
manifest_check = true

[keys]
# tmux uses C-_ as primary prefix and C-b as prefix2. Herdr supports one prefix;
# set Herdr to the physical key you use: Ctrl+/.
prefix = "ctrl+/"

# General / config
help = "prefix+?"
settings = "prefix+s"
reload_config = "prefix+q"       # tmux: prefix q source-file ~/.config/tmux/tmux.conf
detach = "prefix+shift+q"        # moved because prefix q reloads config
open_notification_target = "prefix+o"
goto = "prefix+g"
workspace_picker = "prefix+w"
remote_image_paste = "ctrl+v"

# Workspaces (closest Herdr equivalent to tmux sessions)
new_workspace = "prefix+shift+c"      # tmux: prefix C new-session
rename_workspace = "prefix+shift+r"   # tmux: prefix R rename-session
close_workspace = "prefix+shift+k"    # tmux: prefix K kill-session
previous_workspace = "prefix+shift+p" # tmux: prefix P switch-client -p
next_workspace = "prefix+shift+n"     # tmux: prefix N switch-client -n
previous_agent = "prefix+alt+p"
next_agent = "prefix+alt+n"
focus_agent = "ctrl+1..9"
new_worktree = "prefix+shift+g"
open_worktree = "prefix+shift+o"
remove_worktree = "prefix+alt+d"
switch_workspace = ["prefix+shift+1..9", "ctrl+alt+1..9"]

# Tabs (closest Herdr equivalent to tmux windows)
new_tab = "prefix+c"            # tmux: prefix c new-window
rename_tab = "prefix+r"         # tmux: prefix r rename-window
close_tab = "prefix+k"          # tmux: prefix k kill-window
previous_tab = ["alt+left", "prefix+p", "prefix+/"] # closest Herdr-safe leader-style previous tab
next_tab = ["alt+right", "prefix+n"]
switch_tab = "alt+1..9"         # tmux: M-1..M-9 select-window

# Panes
# tmux: prefix h split-window -v, prefix v split-window -h
# Herdr names the actions by divider orientation; keep the physical keys swapped
# to match what you asked for.
split_vertical = "prefix+v"
split_horizontal = "prefix+h"
close_pane = "prefix+x"
zoom = "prefix+z"
rename_pane = "prefix+alt+r"
edit_scrollback = "prefix+e"
copy_mode = "prefix+["
resize_mode = "prefix+ctrl+r"
last_pane = "prefix+tab"
cycle_pane_next = "prefix+ctrl+n"
cycle_pane_previous = "prefix+ctrl+p"
toggle_sidebar = "prefix+b"

# Pane swapping. Use Alt because Shift+K/P are reserved for tmux-like workspace controls.
swap_pane_left = "prefix+alt+h"
swap_pane_down = "prefix+alt+j"
swap_pane_up = "prefix+alt+k"
swap_pane_right = "prefix+alt+l"

# Navigate-mode movement keeps vi-style h/j/k/l.
navigate_workspace_up = "up"
navigate_workspace_down = "down"
navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

# Seamless navigation across Neovim splits and Herdr panes.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# Direct resize bindings to mirror tmux's C-M-S-arrow resize-pane bindings.
[[keys.command]]
key = "ctrl+alt+shift+left"
type = "shell"
command = "${HERDR_BIN_PATH:-herdr} pane resize --direction left --amount 0.05 --current"
description = "resize pane left"

[[keys.command]]
key = "ctrl+alt+shift+down"
type = "shell"
command = "${HERDR_BIN_PATH:-herdr} pane resize --direction down --amount 0.05 --current"
description = "resize pane down"

[[keys.command]]
key = "ctrl+alt+shift+up"
type = "shell"
command = "${HERDR_BIN_PATH:-herdr} pane resize --direction up --amount 0.05 --current"
description = "resize pane up"

[[keys.command]]
key = "ctrl+alt+shift+right"
type = "shell"
command = "${HERDR_BIN_PATH:-herdr} pane resize --direction right --amount 0.05 --current"
description = "resize pane right"

[ui]
sidebar_width = 32
sidebar_min_width = 18
sidebar_max_width = 36
mouse_capture = true
right_click_passthrough_modifier = "ctrl"
mouse_scroll_lines = 3
confirm_close = true
prompt_new_tab_name = true
prompt_new_workspace_name = true
pane_borders = true
pane_gaps = false
show_agent_labels_on_pane_borders = false
agent_panel_sort = "spaces"
accent = "blue"

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "top-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sound]
# Keep sound notifications disabled.
enabled = false

[ui.sound.agents]
droid = "off"

[session]
resume_agents_on_restore = true

[remote]
manage_ssh_config = true

[experimental]
# This persists recent pane output to disk; keep in mind it may include secrets.
pane_history = true
allow_nested = false
kitty_graphics = true

[advanced]
# tmux uses history-limit 50000. Herdr's knob is bytes, so keep a larger
# per-pane scrollback budget than the default 10MB.
scrollback_limit_bytes = 52428800
